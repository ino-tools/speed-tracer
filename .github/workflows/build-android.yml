name: Build Android app

on:
  push:
    branches: [main, 'claude/android*']
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build APK and AAB
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease bundleRelease 2>&1 | tee build.log
          VN=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          VC=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab "out/SpeedTracer-${VN}-${VC}.aab"
          cp app/build/outputs/apk/release/app-release.apk "out/SpeedTracer-${VN}-${VC}.apk"
          echo "vn=${VN}" >> "$GITHUB_OUTPUT"
          echo "vc=${VC}" >> "$GITHUB_OUTPUT"

      # ビルド結果をブランチ android-build-status に残す(API を使えない環境からも結果を確かめられるように)
      - name: Record build status
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/st/out && cp android/out/*.aab /tmp/st/out/ 2>/dev/null || true
          cp android/build.log /tmp/st/build.log 2>/dev/null || echo "no log" > /tmp/st/build.log
          echo "result=${{ steps.build.outcome }} sha=${GITHUB_SHA} ref=${GITHUB_REF_NAME} run=${GITHUB_RUN_NUMBER}" > /tmp/st/STATUS
          git fetch origin android-build-status || true
          git checkout -B android-build-status
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tail -c 200000 /tmp/st/build.log > build.log
          cp /tmp/st/STATUS STATUS
          # Play Console へブラウザから直接アップロードできるよう .aab も置く(raw.githubusercontent.com は CORS 可)
          cp /tmp/st/out/*.aab . 2>/dev/null || true
          git add -A
          git commit -qm "android build ${GITHUB_RUN_NUMBER}: ${{ steps.build.outcome }}" || true
          git push -f origin android-build-status

      - name: Publish (prerelease, so firmware OTA "latest" is not affected)
        if: steps.build.outcome == 'success' && github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.build.outputs.vn }}-${{ steps.build.outputs.vc }}
          name: Androidアプリ v${{ steps.build.outputs.vn }} (${{ steps.build.outputs.vc }})
          prerelease: true
          make_latest: false
          body: |
            SpeedTracer の Android アプリ。
            - `.aab` … Google Play Console(内部テストなど)にアップロードする用
            - `.apk` … 直接インストールして試す用
          files: |
            android/out/*.aab
            android/out/*.apk
